name: Remote training experiments

# Unigram training on GitHub-hosted runners (the research sandbox lacks the
# CPU/RAM for it). Each matrix entry trains one config from a fresh Hub
# download of the official dataset (revision v1.0.0) and evaluates it on the
# full official validation split with the repository scoring code.
# Results are pushed to scratch branches remote-train-results-<tag>.
# Research tooling only: never part of the submission branch.

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0b40a-airf-multilingual-tokenizer-ch]
    paths: [.github/workflows/remote-train.yml, .github/scripts/remote_train.py]

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: uni-repro
            units: '{"en":32,"fr":41,"ha":136,"sw":240,"yo":176,"am":176}'
            denominator: 32
          - tag: uni-am7
            units: '{"en":32,"fr":41,"ha":136,"sw":240,"yo":176,"am":224}'
            denominator: 32
          - tag: uni-am8
            units: '{"en":32,"fr":41,"ha":136,"sw":240,"yo":176,"am":256}'
            denominator: 32
          - tag: uni-am7-sw7
            units: '{"en":32,"fr":41,"ha":136,"sw":224,"yo":176,"am":224}'
            denominator: 32
          - tag: uni-fr1-am7
            units: '{"en":32,"fr":32,"ha":136,"sw":240,"yo":176,"am":224}'
            denominator: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install --quiet "tokenizers==0.22.1" "PyYAML==6.0.2" "datasets>=4.0,<5"
      - name: Train and evaluate on the runner
        run: >-
          python .github/scripts/remote_train.py
          --tag "${{ matrix.tag }}"
          --units '${{ matrix.units }}'
          --denominator "${{ matrix.denominator }}"
      - name: Push results to scratch branch
        if: always()
        run: |
          git config user.name "amtc-remote-train"
          git config user.email "amtc-remote-train@users.noreply.github.com"
          git checkout -B "remote-train-results-${{ matrix.tag }}"
          git add -f "remote_train_outputs/${{ matrix.tag }}/" || true
          git commit -m "research: remote training results ${{ matrix.tag }}" || echo "nothing to commit"
          git push --force origin "remote-train-results-${{ matrix.tag }}"
          echo "PUSH_OK"
