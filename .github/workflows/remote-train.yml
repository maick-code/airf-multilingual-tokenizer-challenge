name: Remote training experiments

# Trains on a GitHub-hosted runner (more CPU/RAM than the research sandbox and
# direct Hugging Face access):
#   1. byte-level reproduction of the submitted BPE from a fresh Hub download;
#   2. exploratory Unigram training with the same recipe, evaluated on the
#      full official validation split with the repository scoring code.
# Results are pushed to the scratch branch `remote-train-results`.
# Research tooling only: never part of the submission branch.

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0b40a-airf-multilingual-tokenizer-ch]
    paths: [.github/workflows/remote-train.yml, .github/scripts/remote_train.py]

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install --quiet "tokenizers==0.22.1" "PyYAML==6.0.2" "datasets>=4.0,<5"
      - name: Train and evaluate on the runner
        run: python .github/scripts/remote_train.py
      - name: Push results to scratch branch
        if: always()
        run: |
          git config user.name "amtc-remote-train"
          git config user.email "amtc-remote-train@users.noreply.github.com"
          git checkout -B remote-train-results
          git add -f remote_train_outputs/report.json || true
          git add -f remote_train_outputs/bpe-repro-tokenizer.json || true
          git add -f remote_train_outputs/unigram-tokenizer.json || true
          git commit -m "research: remote training results (BPE repro + Unigram)" || echo "nothing to commit"
          git push --force origin remote-train-results
          echo "PUSH_OK"
