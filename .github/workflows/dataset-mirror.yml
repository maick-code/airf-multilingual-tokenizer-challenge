name: Dataset mirror

# One-off helper that exports the pinned official dataset
# (Similoluwa/african-multilingual-tokenizer-challenge @ v1.0.0) as the
# competition CSV files and uploads them as an artifact, so research can
# continue from environments without direct Hugging Face access.
# Not part of the submission contract; lives only on the research branch.

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0b40a-airf-multilingual-tokenizer-ch]
    paths: [.github/workflows/dataset-mirror.yml]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export pinned dataset to competition CSVs
        run: |
          python -m pip install --quiet "datasets>=4.0,<5"
          mkdir -p data/public
          python - <<'EOF'
          import csv
          import hashlib
          from collections import Counter

          from datasets import load_dataset

          for split in ("train", "validation"):
              dataset = load_dataset(
                  "Similoluwa/african-multilingual-tokenizer-challenge",
                  split=split,
                  revision="v1.0.0",
              )
              path = f"data/public/{split}.csv"
              with open(path, "w", encoding="utf-8", newline="") as handle:
                  writer = csv.writer(handle)
                  writer.writerow(["language", "text"])
                  writer.writerows(
                      zip(dataset["language"], dataset["text"], strict=True)
                  )
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              counts = Counter(dataset["language"])
              print(f"{split}: {len(dataset)} rows")
              print(f"{split}: sha256 {digest}")
              print(f"{split}: per-language {dict(sorted(counts.items()))}")
          EOF
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: amtc-data-v1.0.0
          path: |
            data/public/train.csv
            data/public/validation.csv
          retention-days: 14
          if-no-files-found: error
